name: Conformance

# Daily: install the latest release of every tool, run every case, and commit results/<date>.json +
# docs/data/latest.json to main, which GitHub Pages serves. Not triggered by push, so its own commit never re-runs it.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conformance
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - run: bash scripts/install-tools.sh .tools
      - run: .tools/py/bin/python scripts/run.py --tools $PWD/.tools > run.log 2>&1 || (tail -50 run.log; exit 1)
      - run: python3 scripts/summary.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results docs/data
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Conformance run $(date -u +%F)"
          git push
