# The tools under test. {f} = the case file, {schema} = the official schema directory for the case's version,
# schema-check.mjs and parser-validate.mjs are copied into {node} by run.py so they resolve their packages there.
# {nb} = node_modules/.bin, {node} = the node tools dir, {py} = the python venv bin, {go} = the go bin dir, {suite} = this repo,
# {java} = the JDK's java, {tools} = the tools dir (openapi-generator-cli.jar, dotnet-tools/).
# role: validates = says valid/invalid; lints = a linter, judged on its error-severity results only.
# A tool's verdict is its exit code: 0 = valid, non-zero = invalid, unless an `error` pattern says it crashed instead,
# or an `unsupported` pattern says it declined the document's OpenAPI version (scored apart, never as a pass or a fail).
# Spectral, vacuum and the ReadMe parser decline a version they do not know by falling back to the 3.0 schema's
# `openapi` pattern (^3.0.x), so that message is their decline.
# One OAI case (security-scheme-object-examples) $refs https://example.com/api/openapi.json, which 404s. A tool that
# fails to fetch an external document has not judged the case, so for every tool this pattern means `error`, not a verdict.
fetch_error: 'HTTP ERROR 404|404 Not Found|disallowed external reference|only internal refs are supported'
tools:
  - id: oai-schema
    name: Official OAI JSON Schema (hyperjump)
    repo: https://github.com/OAI/OpenAPI-Specification
    role: reference
    version_cmd: "cat {suite}/cases/oai/SOURCE"
    cmd: "node {node}/schema-check.mjs {schema} {f}"
  - id: spectral
    name: Spectral (spectral:oas)
    repo: https://github.com/stoplightio/spectral
    role: lints
    version_cmd: "{nb}/spectral --version"
    cmd: "{nb}/spectral lint -r {suite}/rulesets/spectral-oas.yaml -F error {f}"
    unsupported: 'unrecognized-format|No ruleset has been found|does not match any of the supported formats'
    notes: "Detects an undefined security scheme (oas3-operation-security-defined) at warning severity, which errors-only scoring counts as a miss."
    unsupported: 'unrecognized-format|No ruleset has been found|does not match any of the supported formats|match pattern .{0,3}\^3\\+\.0'
  - id: redocly
    name: Redocly CLI lint (spec ruleset)
    repo: https://github.com/Redocly/redocly-cli
    role: lints
    version_cmd: "{nb}/redocly --version"
    cmd: "{nb}/redocly lint --extends=spec --format=stylish {f}"
    unsupported: 'Unsupported OpenAPI version'
  - id: vacuum
    name: vacuum lint
    repo: https://github.com/daveshanley/vacuum
    role: lints
    version_cmd: "{go}/vacuum version"
    cmd: "{go}/vacuum lint -r {suite}/rulesets/vacuum-oas.yaml -n error --min-score 0 -b -q --format stylish {f}"
    unsupported: 'match pattern .{0,3}\^3\\+\.0'
  - id: swagger-parser
    name: "@apidevtools/swagger-parser"
    repo: https://github.com/APIDevTools/swagger-parser
    role: validates
    version_cmd: "node -p \"require('{node}/node_modules/@apidevtools/swagger-parser/package.json').version\""
    cmd: "node {node}/parser-validate.mjs @apidevtools/swagger-parser {f}"
    unsupported: 'Unsupported OpenAPI version'
  - id: readme-openapi-parser
    name: "@readme/openapi-parser"
    repo: https://github.com/readmeio/oas/tree/main/packages/parser
    role: validates
    version_cmd: "node -p \"require('{node}/node_modules/@readme/openapi-parser/package.json').version\""
    cmd: "node {node}/parser-validate.mjs @readme/openapi-parser {f}"
    unsupported: 'is currently unsupported|Unsupported OpenAPI version|match pattern .{0,3}\^3\\+\.0'
  - id: seriousme
    name: "@seriousme/openapi-schema-validator"
    repo: https://github.com/seriousme/openapi-schema-validator
    role: validates
    version_cmd: "node -p \"require('{node}/node_modules/@seriousme/openapi-schema-validator/package.json').version\""
    cmd: "{nb}/validate-api {f}"
    unsupported: 'Unsupported specification version|not supported|Cannot find supported'
  - id: openapi-spec-validator
    name: openapi-spec-validator (Python)
    repo: https://github.com/python-openapi/openapi-spec-validator
    role: validates
    version_cmd: "{py}/pip show openapi-spec-validator | grep Version"
    cmd: "{py}/openapi-spec-validator --validation-errors all {f}"
    error: 'Traceback'
    unsupported: 'Unsupported (spec|OpenAPI) version|could not detect|Spec schema version not detected|yaml: Error: *(\n|$)'
  - id: kin-openapi
    name: kin-openapi (Go, cmd/validate)
    repo: https://github.com/getkin/kin-openapi
    role: validates
    version_cmd: "cd {go}/.. && go version -m {go}/validate | grep kin-openapi | head -1"
    cmd: "{go}/validate {f}"
  - id: speakeasy-openapi
    name: Speakeasy openapi CLI (spec validate)
    repo: https://github.com/speakeasy-api/openapi
    role: validates
    version_cmd: "{go}/openapi --version"
    cmd: "{go}/openapi spec validate {f}"
    unsupported: 'validation-supported-version|unsupported version'
  - id: openapi-generator
    name: openapi-generator validate (Java, swagger-parser)
    repo: https://github.com/OpenAPITools/openapi-generator
    role: validates
    version_cmd: "{java} -jar {tools}/openapi-generator-cli.jar version"
    cmd: "{java} -jar {tools}/openapi-generator-cli.jar validate -i {f}"
    # An openapi version it does not recognise falls through to the Swagger 1.x converter, which fails to parse it.
    unsupported: 'SwaggerCompatConverter - failed to read resource listing'
    notes: "Built on swagger-parser (Java), which also powers the generator's SDK output. It does not recognise 3.2: the document falls through to its Swagger 1.x converter and fails to parse, so 3.2 is scored as declined."
  - id: hidi
    name: Microsoft OpenAPI.NET (hidi validate)
    repo: https://github.com/microsoft/OpenAPI.NET
    role: validates
    version_cmd: "{tools}/dotnet-tools/hidi --version"
    cmd: "{tools}/dotnet-tools/hidi validate -d {f}"
    unsupported: 'is not supported'
