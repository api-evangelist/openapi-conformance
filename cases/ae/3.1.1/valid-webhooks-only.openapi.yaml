openapi: 3.1.1
info:
  title: Conformance base
  version: 1.0.0
servers:
- url: https://api.example.com/v1
components:
  schemas:
    Pet:
      type: object
      required:
      - name
      properties:
        id:
          type: string
        name:
          type: string
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-API-Key
      in: header
tags:
- name: pets
webhooks:
  newPet:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: ok
